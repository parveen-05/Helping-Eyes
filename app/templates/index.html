<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helping Eyes</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <h1>Helping Eyes</h1>
        <p>Your AI-powered assistive reading companion</p>
    </header>

    <main>
        <section>
            <h2>Welcome to Helping Eyes</h2>

            <p>Upload an image to extract and understand its text.</p>

            <div class="upload-container">

                <input type="file" id="imageInput" accept="image/*">

                <button id="uploadButton">
                    Upload Image
                </button>

                <p id="uploadStatus" aria-live="polite"></p>

                <!-- Image Quality Report -->
                <div id="qualityResult" class="quality-result" style="display: none;">

                    <h3>Image Quality Report</h3>

                    <p id="qualityStatus"></p>

                    <div class="quality-metrics">
                        <div class="metric">
                            <span>Sharpness</span>
                            <strong id="sharpnessValue">-</strong>
                        </div>

                        <div class="metric">
                            <span>Brightness</span>
                            <strong id="brightnessValue">-</strong>
                        </div>

                        <div class="metric">
                            <span>Contrast</span>
                            <strong id="contrastValue">-</strong>
                        </div>

                        <div class="metric">
                            <span>Glare</span>
                            <strong id="glareValue">-</strong>
                        </div>
                    </div>

                    <h4>Detected Problems</h4>
                    <ul id="qualityProblems"></ul>

                    <h4>Suggestion</h4>
                    <p id="qualitySuggestion"></p>

                    <p id="qualitySummary" class="quality-summary"></p>

                </div>

                <!-- OCR Result Section -->
                <div id="ocrResult" class="ocr-result" style="display: none;">

                    <h3>Extracted Text</h3>

                    <pre id="extractedText"></pre>

                </div>

            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>

</body>

</html>
